			background: #333333;
			color: #ffffff;
			link-color: #ffffff;
		
        }

        .top-controls {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .language-select {
            padding: 10px 12px;
            color: #46515d;
            background: var(--accent-dark);
            border: 1px solid #cbd2d9;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        h1 {
            text-align: center;
			color: #ffffff;
        }
		
		h2 {
			text-align: center;
			font-size: 22px;
			font-color: #ffffff;
		}

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            height: auto;
            padding: 60px 20px 40px;
            box-sizing: border-box;
        }

        .tool {
            margin: 20px;
            padding: 20px;
            border: 1px solid #000;
            border-radius: 8px;
            width: 60%;
            text-align: center;
			background: #282828;
        }

        @media (max-width: 700px) {
            .tool {
                width: 100%;
            }
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        .field-row {
            display: flex;
            align-items: stretch;
            gap: 10px;
        }

        .field-row textarea {
            margin-bottom: 10px;
        }

        .field-row button {
            margin-bottom: 10px;
            min-width: 80px;
        }

        .bit-counter {
            display: inline-block;
            margin-left: 10px;
            color: #F6911D;
            font-weight: bold;
        }

        .result-pair {
            display: flex;
            gap: 20px;
        }

        .result-pair > div {
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 700px) {
            .result-pair {
                flex-direction: column;
                gap: 0;
            }
        }

        button {
            background-color: #ff5a00;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #F6911D;
        }
		
		a:link {
           color: orange;
           text-decoration: none;
         }

        a:visited {
           color: orange;
           text-decoration: none;
         }

        a:hover {
			color: yellow;
			text-decoration: none;
         }

		a:active {
			color: yellow;
			text-decoration: underline;
		 }

        /* Identidade visual da Calculadora de Seed */
        :root {
            color-scheme: light;
            --page-start: #f1f3f5;
            --page-end: #e7eaee;
            --panel: #ffffff;
            --panel-border: #d7dce2;
            --field: #f8f9fa;
            --field-border: #c9d0d8;
            --text: #20262d;
            --muted: #59636f;
            --accent: #52677d;
            --accent-hover: #43586d;
            --accent-dark: #eef1f4;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: linear-gradient(145deg, var(--page-start), var(--page-end));
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .tool {
            padding: 30px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: 0 14px 38px rgba(28, 37, 46, 0.10);
        }

        h2 {
            margin: 4px 0 28px;
            color: var(--text);
            font-size: 26px;
            font-weight: 650;
            letter-spacing: 0.2px;
        }

        .coin-note {
            margin: -18px 0 28px;
            color: var(--muted);
            font-size: 14px;
        }

        .security-warning {
            margin: -12px 0 24px;
            padding: 12px 14px;
            color: #704d00;
            background: #fff4d6;
            border: 1px solid #e5c46d;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
        }

        p {
            margin: 18px 0 8px;
        }

        label {
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        textarea {
            min-height: 68px;
            padding: 14px 16px;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--field-border);
            border-radius: 10px;
            outline: none;
            font-family: Consolas, "Courier New", monospace;
            font-size: 15px;
            line-height: 1.5;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        textarea::placeholder {
            color: #9099a3;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(82, 103, 125, 0.12);
        }

        textarea[readonly] {
            background: #f2f4f6;
        }

            background: #dce9df;
            border-color: #9fb9a6;
            color: #244a32;
        }

        #checksumWord {

            border-color: #9fb9a6;
            color: #244a32;

            color: #ffffff;
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 9px;
            box-shadow: 0 4px 10px rgba(52, 65, 78, 0.14);
            font-size: 14px;
            font-weight: 700;
            transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;

        button:hover {
            color: #ffffff;
            background: var(--accent-hover);
            box-shadow: 0 6px 14px rgba(52, 65, 78, 0.18);

            background: #e1e5e9;

                margin: 0;
                padding: 18px;
                border-radius: 14px;
            }

                gap: 7px;
            }

    <div class="container">
        <div class="tool">
            <div class="top-controls">
                <select id="languageSelect" class="language-select" onchange="setLanguage(this.value)" aria-label="Language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="pt">Português</option>
                </select>
                <button id="wordConfig" onclick="toggleWordConfig()">12 words</button>
                <button data-i18n="clear" onclick="clearPageData()">Clear data</button>
            </div>
            <h2 data-i18n="heading">BIP-39 Seed Generator Using Coin Flips</h2>
            <p class="security-warning" data-i18n="securityWarning">⚠ For real use, run this generator offline.</p>
            <p class="coin-note" data-i18n="instructions">Each bit represents a coin flip: heads = 1 and tails = 0.</p>
            <p>
                <label for="binaryInput" data-i18n="binaryLabel">Binary:</label>
                <span id="bitCounter" class="bit-counter">128 flips remaining</span>
            </p>
            <div class="field-row">
                <textarea id="binaryInput" placeholder="Enter 128 bits (0 and 1 only)" oninput="sanitizeBinaryInput(this)"></textarea>
                <button data-i18n="paste" onclick="pasteBinary(this)">Paste</button>
            </div>
            <p><button data-i18n="calculate" onclick="calculateFromBinary()">Calculate Seed</button></p>
            <p><label for="hexResult" data-i18n="hexLabel">Hexadecimal:</label></p>
            <div class="field-row">
                <textarea id="hexResult" readonly placeholder="The hexadecimal value will appear here"></textarea>
                <button data-i18n="copy" onclick="copyField('hexResult', this)">Copy</button>
            </div>
            <p><label for="hashResult" data-i18n="shaLabel">SHA-256:</label></p>
            <div class="field-row">
                <textarea id="hashResult" readonly placeholder="The SHA-256 hash will appear here"></textarea>
                <button data-i18n="copy" onclick="copyField('hashResult', this)">Copy</button>
            </div>
            <p><label id="wordsLabel" for="wordsResult">First 11 words:</label></p>
            <div class="field-row">
                <textarea id="wordsResult" readonly placeholder="The BIP-39 words will appear here"></textarea>
                <button id="wordsCopyButton" onclick="copyCompleteWords(this)">Copy 12 words</button>
            </div>
            <div class="result-pair">
                <div>
                    <p><label for="remainingBits" data-i18n="remainingLabel">Remaining entropy bits:</label></p>
                    <textarea id="remainingBits" readonly placeholder="The remaining bits will appear here"></textarea>
                </div>
                <div>
                    <p><label for="checksumResult" data-i18n="checksumLabel">Checksum bits (SHA-256):</label></p>
                    <textarea id="checksumResult" readonly placeholder="The binary checksum will appear here"></textarea>
                </div>
                <div>
                    <p><label for="checksumWord" data-i18n="lastWordLabel">Last word:</label></p>
                    <textarea id="checksumWord" readonly placeholder="The last BIP-39 word will appear here"></textarea>
                </div>
            </div>
        </div>
    </div>

	// Converte o binário em hexadecimal.
        function binToHex(binary) {
            let hex = "";
            for (let i = 0; i < binary.length; i += 4) {
                let chunk = binary.substr(i, 4);
                hex += parseInt(chunk, 2).toString(16);
            }
            return hex.toUpperCase();
        }
		
	//crypto.subtle.digest é um método disponível em ambientes JavaScript de navegadores modernos e faz parte do Web Crypto API.
	//É uma maneira de calcular funções de hash criptográficas usando uma variedade de algoritmos, incluindo o bitcoinheiro SHA-256

        function hexStringToArrayBuffer(hexString) {
            const bytes = new Uint8Array(hexString.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            return bytes.buffer;
        }

        function sanitizeBinaryInput(field) {
            const expectedBits = wordCount === 12 ? 128 : 256;
            field.value = field.value
                .replace(/\s/g, "")
                .replace(/[^01]/g, "")
                .slice(0, expectedBits);
            updateBitCounter();
        }

        function updateBitCounter() {
            const currentBits = document.getElementById("binaryInput").value.length;
            const expectedBits = wordCount === 12 ? 128 : 256;
            const counter = document.getElementById("bitCounter");

            counter.textContent = translate("flipsRemaining", { count: expectedBits - currentBits });
        }

        function convertBinaryToWords(binary) {
            const words = [];
            const completeBits = binary.length - (binary.length % 11);

            for (let i = 0; i < completeBits; i += 11) {
                const wordIndex = parseInt(binary.slice(i, i + 11), 2);
                words.push(BIP39_ENGLISH_WORDS[wordIndex]);
            }

            return {
                words: words.join(" "),
                remainingBits: binary.slice(completeBits)
            };
        }

        async function copyField(fieldId, button) {
            const field = document.getElementById(fieldId);

            if (!field.value) {
                return;
            }

            try {
                await navigator.clipboard.writeText(field.value);
            } catch (error) {
                field.select();
                document.execCommand("copy");
            }

            const originalText = button.textContent;
            button.textContent = translate("copied");
            setTimeout(() => button.textContent = originalText, 1200);
        }

        async function copyCompleteWords(button) {
            const words = document.getElementById("wordsResult").value.trim();
            const checksumWord = document.getElementById("checksumWord").value.trim();

            if (!words || !checksumWord) {
                return;
            }

            const completeMnemonic = words + " " + checksumWord;

            try {
                await navigator.clipboard.writeText(completeMnemonic);
            } catch (error) {
                const temporaryField = document.createElement("textarea");
                temporaryField.value = completeMnemonic;
                temporaryField.style.position = "fixed";
                temporaryField.style.opacity = "0";
                document.body.appendChild(temporaryField);
                temporaryField.select();
                document.execCommand("copy");
                temporaryField.remove();
            }

            button.textContent = translate("copied");
            setTimeout(() => button.textContent = translate("copyWords", { count: wordCount }), 1200);
        }

        async function pasteBinary(button) {
            const field = document.getElementById("binaryInput");

            try {
                field.value = await navigator.clipboard.readText();
                sanitizeBinaryInput(field);
                button.textContent = translate("pasted");
                setTimeout(() => button.textContent = translate("paste"), 1200);
            } catch (error) {
                field.focus();
                button.textContent = translate("usePaste");
                setTimeout(() => button.textContent = translate("paste"), 2000);
            }
        }

        async function calculateFromBinary() {
            const binaryInput = document.getElementById("binaryInput").value.replace(/\s/g, "");
            const hexOutput = document.getElementById("hexResult");
            const hashOutput = document.getElementById("hashResult");
            const wordsOutput = document.getElementById("wordsResult");
            const remainingBitsOutput = document.getElementById("remainingBits");
            const checksumOutput = document.getElementById("checksumResult");
            const checksumWordOutput = document.getElementById("checksumWord");

            hexOutput.value = "";
            hashOutput.value = "";
            wordsOutput.value = "";
            remainingBitsOutput.value = "";
            checksumOutput.value = "";
            checksumWordOutput.value = "";

            if (!binaryInput || !/^[01]+$/.test(binaryInput)) {
                hashOutput.value = translate("invalidBinary");
                return;
            }

            const expectedBits = wordCount === 12 ? 128 : 256;

            if (binaryInput.length !== expectedBits) {
                hashOutput.value = translate("invalidCount", {
                    words: wordCount,
                    bits: expectedBits,
                    actual: binaryInput.length
                });
                return;
            }

            try {
                const hexValue = binToHex(binaryInput);
                hexOutput.value = hexValue;
                const data = hexStringToArrayBuffer(hexValue);
                const hashBuffer = await crypto.subtle.digest("SHA-256", data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(byte => ('0' + byte.toString(16)).slice(-2)).join('');
                hashOutput.value = hashHex;
                const wordResult = convertBinaryToWords(binaryInput);
                wordsOutput.value = wordResult.words;
                remainingBitsOutput.value = wordResult.remainingBits + " (" + wordResult.remainingBits.length + " bits)";
                const checksumHexLength = wordCount === 12 ? 1 : 2;
                const checksumBinary = hashHex.slice(0, checksumHexLength)
                    .split("")
                    .map(digit => parseInt(digit, 16).toString(2).padStart(4, "0"))
                    .join("");
                checksumOutput.value = checksumBinary;

                const finalWordBits = wordResult.remainingBits + checksumBinary;
                checksumWordOutput.value = BIP39_ENGLISH_WORDS[parseInt(finalWordBits, 2)];
            } catch (error) {
                console.error(error);
                hashOutput.value = translate("hashError");
            }
        }
